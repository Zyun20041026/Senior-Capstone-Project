<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>湿实验室 WET LAB</title>
<meta name="description" content="写实湿实验室沙盒：用 A549 细胞练习移液、传代、细胞计数、梯度稀释和 CCK-8 读板。">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
<style>
/* 一个 1600×900 的实验室整体等比缩放到窗口。场景是冷白灯下的仪器；
   界面是深色玻璃面板，强调色取丁腈手套的蓝紫。只有一种外观，不跟随系统主题。 */
:root{
  color-scheme:dark;
  --ink:#0c1015;            /* 窗口底色 */
  --glass:rgba(16,20,27,.80);
  --glass-hi:rgba(28,34,44,.92);
  --line:rgba(255,255,255,.09);
  --line-hi:rgba(255,255,255,.18);
  --fg:#e9edf3;
  --muted:#98a2b1;
  --faint:#626c7a;
  --nitrile:#8b84ff;        /* 强调：丁腈手套 */
  --nitrile-deep:#5d55e6;
  --ok:#3fd18f; --warn:#f3b64a; --err:#ff6262;
  --phenol:#e06478;         /* 培养基酚红 */
  --paper:#f6f4ee; --paper-ink:#28303a; --paper-grid:rgba(60,110,170,.13);
  --sans:"PingFang SC",-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --num:"SF Pro Display",-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;}
#app{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 40%,#1a212b 0%,#0c1015 70%);}
#game{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;border-radius:14px;background:#cfd6de;box-shadow:0 30px 80px -30px rgba(0,0,0,.8);user-select:none;-webkit-user-select:none;}
#gl{position:absolute;inset:0;width:1600px;height:900px;display:block;}
#scene{position:absolute;inset:0;width:1600px;height:900px;display:block;background:transparent;}
#hud{position:absolute;inset:0;pointer-events:none;}
#hud > *{pointer-events:auto;}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;}
kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:6px;font:600 12px/1 var(--num);color:#e8ecf4;background:linear-gradient(#2d3440,#1d222b);border:1px solid rgba(255,255,255,.16);box-shadow:0 1px 0 rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);}
kbd.wide{min-width:46px}
button{font-family:var(--sans);}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);}

/* 顶栏 */
#topbar{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:18px;padding:0 18px;box-sizing:border-box;background:linear-gradient(rgba(14,18,24,.94),rgba(14,18,24,.86));border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
.brand b{font:700 21px/1 var(--sans);letter-spacing:.08em;color:#fff;}
.brand span{font:500 13px/1.2 var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;}
.tabs{display:flex;gap:4px;margin-left:8px;}
.tab{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 8px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);font:500 14px/1 var(--sans);cursor:pointer;}
.tab kbd{min-width:20px;height:20px;font-size:11px;}
.tab:hover{color:var(--fg);background:rgba(255,255,255,.04);}
.tab[aria-current="true"]{color:#fff;background:rgba(139,132,255,.14);border-color:rgba(139,132,255,.35);}
.tab[disabled]{opacity:.32;cursor:not-allowed;}
.spacer{flex:1}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.clock .t{font:600 17px/1 var(--num);font-variant-numeric:tabular-nums;color:#fff;letter-spacing:.02em;}
.clock .s{font:500 11px/1 var(--sans);color:var(--muted);}
.clock .s.hot{color:var(--warn)}
.tbtn{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg);font:500 13px/1 var(--sans);cursor:pointer;}
.tbtn:hover{border-color:var(--line-hi);background:rgba(255,255,255,.06);}
.tbtn:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--nitrile);outline-offset:2px;}

/* 当前步骤 */
#step{position:absolute;left:16px;top:70px;max-width:520px;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 12px;border-radius:12px;cursor:pointer;}
#step .n{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(139,132,255,.16);color:#c9c5ff;font:700 14px/1 var(--num);font-variant-numeric:tabular-nums;}
#step .tx{min-width:0;display:grid;gap:4px;}
#step .tx b{font:600 14px/1.3 var(--sans);color:#fff;}
#step .tx span{font:400 12.5px/1.45 var(--sans);color:var(--muted);}
#step .bar{position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;}
#step .bar i{display:block;height:100%;background:var(--nitrile);}

/* SOP 抽屉 */
#sop{position:absolute;left:16px;top:70px;bottom:92px;width:400px;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;}
#sop header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);}
#sop header b{font:600 15px/1 var(--sans);}
#sop ol{list-style:none;margin:0;padding:8px 8px 14px;overflow:auto;display:grid;gap:2px;}
#sop li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:9px 10px;border-radius:9px;}
#sop li .i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font:600 11px/1 var(--num);color:var(--muted);margin-top:1px;}
#sop li.done .i{border-color:var(--ok);background:var(--ok);color:#06150e;}
#sop li.cur{background:rgba(139,132,255,.1);}
#sop li.cur .i{border-color:var(--nitrile);color:#fff;}
#sop li b{display:block;font:500 13.5px/1.4 var(--sans);color:var(--fg);}
#sop li.done b{color:var(--muted);}
#sop li span{display:block;margin-top:3px;font:400 12px/1.5 var(--sans);color:var(--muted);}
#sop li .k{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}

/* 底栏 */
#bottombar{position:absolute;left:0;right:516px;bottom:0;height:72px;border-top-right-radius:14px;border-right:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px;box-sizing:border-box;background:linear-gradient(rgba(14,18,24,.88),rgba(14,18,24,.96));border-top:1px solid var(--line);}
#held{flex:none;width:300px;height:54px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--line);box-sizing:border-box;}
#held .ic{flex:none;width:30px;height:42px;}
#held .meta{min-width:0;display:grid;gap:4px;}
#held .meta b{font:600 13px/1 var(--sans);color:#fff;}
#held .meta span{font:400 12px/1.2 var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#held .dial{margin-left:auto;display:flex;gap:2px;}
#held .dial i{width:15px;height:24px;display:grid;place-items:center;font:600 16px/1 var(--num);font-style:normal;color:#141820;background:linear-gradient(#f3f4f6,#d6d9de 55%,#eef0f2);border-radius:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}
#held .dial i.d{color:#c0242c}
#keys{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:center;gap:6px 14px;}
#keys .k{display:flex;align-items:center;gap:6px;font:400 12.5px/1 var(--sans);color:var(--muted);white-space:nowrap;}
#keys .k.on{color:#fff}
#keys .k.on kbd{background:linear-gradient(#5d55e6,#4a43c9);border-color:#8b84ff;}
#traylabel{position:absolute;right:500px;bottom:27px;font:500 12px/1 var(--sans);color:var(--faint);}

/* 提示、悬停 */
#toasts{position:absolute;right:16px;top:70px;width:360px;display:grid;gap:8px;pointer-events:none;}
.toast{padding:11px 14px 12px;border-radius:11px;display:grid;gap:4px;border-left:3px solid var(--nitrile);animation:tin .22s ease-out;}
.toast b{font:600 13px/1.35 var(--sans);}
.toast span{font:400 12px/1.5 var(--sans);color:var(--muted);}
.toast.warn{border-left-color:var(--warn)} .toast.error{border-left-color:var(--err)} .toast.ok{border-left-color:var(--ok)} .toast.mentor{border-left-color:#8b84ff} .toast.mentor b{color:#d6d2ff}
.src-top{display:grid;gap:10px;margin-bottom:12px}.src-tabs .chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font:500 13px var(--sans);cursor:pointer}.src-tabs .chip[aria-pressed=true]{background:rgba(139,132,255,.18);border-color:rgba(139,132,255,.6);color:#e8e6ff}.src-tabs{display:flex;gap:8px;flex-wrap:wrap}.src-tabs .chip span{margin-left:6px;color:var(--faint);font:500 11px var(--num)}
.src-q{width:100%;box-sizing:border-box;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text, #e8ecf2);font:400 13px var(--sans)}
.src-legend{margin:0;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font:400 12px var(--sans);color:var(--muted)}.src-legend i{margin-right:2px}
.src-st{display:inline-block;padding:2px 8px;border-radius:999px;font:600 11px/1.4 var(--sans);font-style:normal;white-space:nowrap}
.src-st.verified{background:rgba(70,211,154,.16);color:#7fe8b8}.src-st.estimate{background:rgba(255,200,87,.15);color:#ffd27a}.src-st.pending{background:rgba(255,107,107,.15);color:#ff9d9d}
.src-list{display:grid;gap:8px}.src-row{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.src-row header{display:flex;gap:10px;align-items:center;justify-content:space-between}.src-row header b{font:600 13.5px var(--sans)}
.src-row p{margin:4px 0 0;font:400 12.5px/1.6 var(--sans);color:var(--muted)}.src-v{color:#e8ecf2 !important;font-family:var(--num) !important}.src-v span{margin-left:10px;color:var(--faint);font:400 11.5px var(--sans)}
.src-row ul{margin:6px 0 0;padding-left:18px;font:400 12px/1.6 var(--sans)}.src-row a{color:#a9a3ff;text-decoration:none}.src-row a:hover{text-decoration:underline}.src-row li span{margin-left:8px;color:var(--faint)}
.toast.error b{color:#ffb4b4}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#tip{position:absolute;pointer-events:none;padding:9px 11px;border-radius:9px;max-width:280px;display:grid;gap:3px;z-index:5;}
#tip b{font:600 12.5px/1.3 var(--sans);color:#fff;}
#tip span{font:400 11.5px/1.45 var(--sans);color:var(--muted);}
#tip .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.tag{font:500 10.5px/1 var(--sans);padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:var(--muted);}
.tag.ok{background:rgba(63,209,143,.14);color:#7fe6b5}.tag.warn{background:rgba(243,182,74,.15);color:#f6cc80}.tag.err{background:rgba(255,98,98,.15);color:#ffa3a3}

/* 弹层面板 */
.panel{position:absolute;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.65);}
.panel > header{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line);}
.panel > header h2{margin:0;font:600 16px/1.2 var(--sans);}
.panel > header p{margin:0;font:400 12.5px/1.4 var(--sans);color:var(--muted);}
.panel > header .x{margin-left:auto}
.panel .body{padding:16px 18px;overflow:auto;flex:1 1 auto;min-height:0}
.btn{height:36px;padding:0 16px;border-radius:9px;border:1px solid var(--line-hi);background:rgba(255,255,255,.05);color:var(--fg);font:500 13.5px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.primary{background:linear-gradient(#7a72ff,#5d55e6);border-color:#9a94ff;color:#fff;}
.btn.primary:hover{background:linear-gradient(#8780ff,#6860ee)}
.btn.danger{border-color:rgba(255,98,98,.5);color:#ffb0b0}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.field{display:grid;gap:6px;}
.field label{font:500 12.5px/1.3 var(--sans);color:var(--muted);}
.field input,.field select{height:36px;border-radius:8px;border:1px solid var(--line-hi);background:rgba(0,0,0,.25);color:#fff;padding:0 10px;font:500 15px/1 var(--num);font-variant-numeric:tabular-nums;outline:none;}
.field input:focus,.field select:focus{border-color:var(--nitrile);box-shadow:0 0 0 3px rgba(139,132,255,.25);}

/* 实验记录本：方格纸 */
#notebook{position:absolute;right:16px;top:70px;bottom:92px;width:520px;border-radius:6px 14px 14px 6px;background:var(--paper);color:var(--paper-ink);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.6),inset 18px 0 0 #2b3a52;}
#notebook header{padding:18px 22px 10px 40px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid rgba(40,48,58,.18);}
#notebook header h2{margin:0;font:700 17px/1 var(--sans);}
#notebook header span{font:500 12px/1 var(--sans);color:#6b7480}
#notebook .pages{flex:1;overflow:auto;padding:14px 22px 22px 40px;background-image:linear-gradient(var(--paper-grid) 1px,transparent 1px),linear-gradient(90deg,var(--paper-grid) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px;}
#notebook h3{margin:14px 0 8px;font:700 13px/1.3 var(--sans);color:#2b3a52;}
#notebook .rec{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(40,48,58,.18);}
#notebook .rec label{font:500 12.5px/1.35 var(--sans);}
#notebook .rec small{display:block;font:400 11px/1.4 var(--sans);color:#6b7480;margin-top:2px}
#notebook .rec input{height:30px;border:0;border-bottom:1.5px solid #2b3a52;background:transparent;font:600 16px/1 "Bradley Hand","Noteworthy",var(--num);color:#1f3fa8;padding:0 4px;outline:none;width:100%;box-sizing:border-box;}
#notebook .rec input:focus{background:rgba(31,63,168,.06)}
#notebook .rec em{font:500 12px/1 var(--sans);color:#6b7480;font-style:normal;min-width:60px}
#notebook .log{font:400 12px/1.65 var(--sans);color:#3a434e;}
#notebook .log .tm{display:inline-block;width:46px;color:#8a929c;font-variant-numeric:tabular-nums;}
#notebook .calc{display:flex;gap:8px;align-items:center;margin-top:6px;}
#notebook .calc input{flex:1;height:32px;border-radius:6px;border:1px solid rgba(40,48,58,.25);background:#fff;padding:0 10px;font:500 14px/1 var(--num);color:var(--paper-ink);outline:none;}
#notebook .calc output{min-width:120px;font:600 14px/1 var(--num);color:#1f3fa8;}

/* 全屏页：标题、选关、简报、结算 */
#screen{position:absolute;inset:0;z-index:20;overflow:hidden;}
#screen .bgimg{position:absolute;inset:0;}
#step .btn{flex:none;margin-left:6px}
.field input[type=range]{height:26px;border:0;background:none;padding:0;box-shadow:none;accent-color:var(--nitrile)}

/* 全屏页通用 */
.scr{position:absolute;inset:0;z-index:20;background:radial-gradient(110% 85% at 72% 28%,#19212c 0%,#0c1015 64%);color:var(--fg);overflow:hidden;box-sizing:border-box}
.btn.big{height:46px;padding:0 20px;font-size:15px;border-radius:11px}
.star{fill:#232a33;stroke:#3a4350;stroke-width:1}
.star.on{fill:#f3c14a;stroke:#f7d98c}
.b-kicker{margin:0 0 10px;font:500 14px/1.3 var(--sans);color:#c9c5ff}
.brief h1,.results h1,.fail h1{margin:0 0 18px;font:700 44px/1.15 var(--sans);color:#fff;text-wrap:balance}
.brief h2,.results h2{font:600 14px/1 var(--sans);color:var(--muted);margin:24px 0 12px}
.b-act{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}

/* 标题（老引擎式菜单：静止场景 + 噪点 + 纯文字） */
.scr.title{background:#070908;padding:0}
.tt-bgc{position:absolute;inset:0;width:100%;height:100%;display:block}
.tt-grain{position:absolute;inset:-50%;opacity:.1;pointer-events:none;background-repeat:repeat;animation:ttGrain .5s steps(4) infinite}
@keyframes ttGrain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(1%,3%)}}
.tt-left{position:absolute;left:112px;top:262px;animation:ttIn 2.4s ease-out both}
@keyframes ttIn{from{opacity:0}to{opacity:1}}
.tt-mark{margin:0 0 84px;font:700 88px/1 var(--sans);letter-spacing:.1em;color:#e9ece8;text-shadow:0 2px 0 rgba(0,0,0,.55)}
.tt-mark small{display:block;margin:12px 0 0 4px;font:600 17px/1 var(--num);letter-spacing:.86em;color:#a7afa9}
.tt-menu{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tt-item{padding:3px 0;border:0;background:none;font:600 21px/1.3 var(--sans);letter-spacing:.05em;color:rgba(228,232,226,.58);text-shadow:0 1px 1px rgba(0,0,0,.7);cursor:pointer}
.tt-item.on{color:#fff}
.tt-item.tt-small{margin-top:24px;font-size:15px;color:rgba(228,232,226,.38)}
.tt-item.tt-small:hover{color:rgba(255,255,255,.75)}
.tt-foot{position:absolute;left:112px;bottom:30px;margin:0;font:400 12px/1.5 var(--sans);color:rgba(205,212,204,.34)}
/* 序章故事卡 */
.scr.story{background:#000;display:grid;place-items:center}
.st-card{max-width:900px;padding:0 60px;text-align:center;animation:stIn 1.1s cubic-bezier(.2,.7,.2,1) both;cursor:pointer}
@keyframes stIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.st-card h2{margin:0;font:600 40px/1.45 var(--sans);letter-spacing:.04em;color:#f1f3f6}
.st-card p{margin:22px 0 0;font:400 19px/1.8 var(--sans);color:#9aa4b0}
.st-dots{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.st-dots i{width:22px;height:2px;background:#2b313a}.st-dots i.on{background:#c9c5ff}
.st-hint{position:absolute;right:48px;bottom:40px;margin:0;font:400 12.5px var(--sans);color:#5f6a77}

/* 动效 */
.panel{animation:panelIn .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.flyer{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#7fd3ff;box-shadow:0 0 18px #7fd3ff;z-index:40;pointer-events:none;transition:transform .28s cubic-bezier(.5,0,.7,1),opacity .28s}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important}}

/* 开放模式入口 */
.t-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px;max-width:540px}
.t-mode{display:grid;gap:6px;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line-hi);background:rgba(255,255,255,.035);color:var(--fg);cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
.t-mode:hover{background:rgba(139,132,255,.1);border-color:#8b84ff;transform:translateY(-1px)}
.t-mode b{font:600 15px/1.2 var(--sans);color:#fff;display:flex;gap:8px;align-items:center}
.t-mode span{font:400 12.5px/1.55 var(--sans);color:var(--muted)}
.scr.diff{display:grid;place-items:center}
.d-copy{width:720px}.d-copy h1{margin:0 0 14px;font:700 44px/1.1 var(--sans);color:#fff}

.fa-lgs{display:grid;gap:5px;min-width:0;flex:1}.fa-lg{display:flex;gap:7px;align-items:center;font:400 12.5px/1.4 var(--sans);color:var(--muted)}.fa-lg i{width:11px;height:11px;border-radius:50%;flex:none}.fa-lg em{color:var(--warn);font-style:normal}
.nb-atlas{overflow-x:auto;margin:4px 0 10px}.nb-atlas table{border-collapse:collapse;font:500 12px/1.3 var(--sans)}.nb-atlas th,.nb-atlas td{border:1px solid rgba(43,58,82,.18);padding:4px 7px;text-align:right;white-space:nowrap}.nb-atlas th{font-weight:600;text-align:left}.nb-atlas td.bad{color:#c0242c;text-decoration:line-through}
#notebook h4{font:600 12.5px/1.2 var(--sans);margin:10px 0 6px;opacity:.7}
.d-h{font:600 13px/1 var(--sans);color:var(--muted);margin:0 0 10px;display:flex;gap:6px;align-items:center}
.d-pats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px}

.d-pat.on{border-color:#46d39a;background:rgba(70,211,154,.1)}
.d-pat b{font:600 16px/1.2 var(--sans);color:#fff}.d-pat small{font:500 12px/1 var(--sans);color:var(--muted)}.d-pat span{font:400 12.5px/1.55 var(--sans);color:var(--muted)}
.ce-truth{font:400 14px/1.6 var(--sans);color:var(--muted);margin:6px 0 0}
.d-opt b{font:600 17px/1.2 var(--sans);color:#fff;display:flex;gap:8px;align-items:center}.d-opt span{font:400 13.5px/1.6 var(--sans);color:var(--muted)}
/* 结案 */
.scr.caseend{display:flex;flex-direction:column;gap:18px;padding:40px 56px 30px;overflow:auto}
.ce-head h1{display:flex;align-items:center;gap:18px;margin:0 0 14px;font:700 40px/1 var(--sans);color:#fff}
.tier{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:16px;font:700 38px/1 var(--num);background:#2a3240;color:#fff}
.tier.t-S{background:#2e7d5b}.tier.t-A{background:#3d6fb3}.tier.t-B{background:#6a5bc4}.tier.t-C{background:#9a6a2c}.tier.t-D{background:#8a3434}
.ce-facts{display:flex;gap:36px;margin:0}.ce-facts dt{font:500 12.5px var(--sans);color:var(--muted)}.ce-facts dd{margin:4px 0 0;font:600 26px var(--num);color:#fff}
.ce-grid{display:grid;grid-template-columns:300px 1fr 420px;gap:26px;min-height:0}
.ce-grid h2{font:600 14px/1 var(--sans);color:var(--muted);margin:0 0 12px}
.ce-ct{display:grid;gap:12px;align-content:start}.ce-ct div{display:grid;gap:6px}.ce-ct canvas{border-radius:10px}.ce-ct span{font:400 12.5px var(--sans);color:var(--muted)}
.ce-story ol{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:540px;overflow:auto}
.ce-story li{display:grid;grid-template-columns:54px 10px 1fr;gap:10px;align-items:center;font:400 13.5px/1.5 var(--sans);color:#cdd6df;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.025)}
.ce-story li i{width:10px;height:10px;border-radius:50%;background:#4a5361}.ce-story li.pd{background:rgba(255,98,98,.08)}.ce-story li.pd i{background:var(--err)}.ce-story li.tox i{background:var(--warn)}.ce-story li.ct i{background:#7fd3ff}
.ce-m{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:0 0 10px;font:400 13px var(--sans);color:var(--muted)}.ce-m b{color:#fff;font-weight:500}
.ce-m i{grid-column:1/-1;height:5px;border-radius:3px;background:linear-gradient(90deg,#7fd3ff calc(var(--q)*100%),rgba(255,255,255,.07) 0)}
.ce-q article{margin:0 0 10px}.ce-q article header{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;font:400 12.5px var(--sans);color:var(--muted)}.ce-q article p{margin:4px 0 0;font:400 12.5px/1.6 var(--sans);color:#aab3c0}
.ce-q article header b{flex:none;white-space:nowrap}
/* 病例看板 / 物资柜 / 样本 */
.cf .body,.sup .body,.fa .body{padding:14px 18px}
.cf h3,.fa h3{margin:12px 0 8px;font:600 13.5px var(--sans);color:#dbe4ee}
.cf-top{display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;gap:16px;padding:0 0 12px;border-bottom:1px solid var(--line)}
.cf-top span{display:block;font:500 12px var(--sans);color:var(--muted);margin-bottom:4px}.cf-top b{font:600 17px var(--sans);color:#fff;display:flex;align-items:center;gap:6px}.cf-top small{font-size:12px;color:var(--faint);margin-left:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.cf-mid{margin:12px 0}.cf-mid canvas{display:block;border-radius:10px;cursor:pointer}
.cf-leg{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 0;font:400 12px var(--sans);color:var(--muted)}
.cf-leg i{display:inline-block;vertical-align:middle;margin-right:6px}.cf-leg .pt{width:9px;height:9px;border-radius:50%;background:#e7edf4}.cf-leg .tr{width:18px;border-top:2px dashed rgba(255,255,255,.55)}.cf-leg .band{width:14px;height:8px;border-radius:2px}
.cf-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.cf-act .sep{flex:1}
.cf-bot{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
.cf-bot header,.cf-rx header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px;font:600 13.5px var(--sans);color:#dbe4ee}.cf-bot header span{display:flex;gap:4px}
.cf-list{display:grid;gap:4px;max-height:210px;overflow:auto;align-content:start}.cf-list.tall{max-height:440px}
.cf-e{display:grid;grid-template-columns:44px 44px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.025);font:400 12.5px/1.45 var(--sans);color:#cdd6df;text-align:left;border:1px solid transparent}
.cf-e .k{color:var(--muted)}.cf-e .m{color:var(--faint);font-size:12px}.cf-e em{display:block;font-style:normal;color:var(--muted);font-size:11.5px}.cf-e em.bad{color:var(--warn)}
.cf-e.void{opacity:.45}.cf-e.pick{cursor:pointer}.cf-e.pick.on{border-color:rgba(111,195,255,.5)}.cf-e.pick[aria-pressed=true]{background:rgba(111,195,255,.14);border-color:#6fc3ff}
.cf-rx{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
.cf-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0;font:400 13px var(--sans);color:var(--muted)}
.cf-dose{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center}.cf-dose b{font:600 22px var(--num);color:#fff}.cf-dose input{accent-color:#8b84ff}
.cf .chip,.fa .chip{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line-hi);background:rgba(255,255,255,.03);color:#cdd6df;font:400 12.5px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .18s,border-color .18s}
.cf .chip[aria-pressed=true],.fa .chip[aria-pressed=true]{background:rgba(111,195,255,.18);border-color:#6fc3ff;color:#fff}
.sup-top{display:flex;justify-content:space-between;font:400 13.5px var(--sans);color:var(--muted);margin:0 0 10px}.sup-top b{color:#fff}
.sup-list{display:grid;gap:4px;max-height:520px;overflow:auto}
.sup-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;border:1px solid transparent;background:rgba(255,255,255,.025);color:#cdd6df;font:400 13.5px var(--sans);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.sup-row em{display:block;font-style:normal;font-size:11.5px;color:var(--warn)}.sup-row b{font:500 13px var(--num);color:#fff}
.sup-row.on{border-color:#6fc3ff;background:rgba(111,195,255,.1)}.sup-row[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.sup-row.got{background:rgba(63,209,143,.18);border-color:var(--ok)}
.sup-foot{margin-top:10px;font:400 12px var(--sans);color:var(--faint)}
.fa-grid{display:grid;grid-template-columns:1fr 640px;gap:22px}
.fa-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0;font:400 12.5px var(--sans);color:var(--muted)}.fa-row > span:first-child{min-width:92px}.fa-row b{font:600 18px var(--num);color:#fff}
.fa-plates{display:grid;gap:4px;margin:10px 0}.fa-p{padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.03);font:400 12.5px var(--sans);color:#cdd6df}.fa-p .ok{color:var(--ok);margin-left:6px}.fa-p em{display:block;font-style:normal;color:var(--warn)}.fa-p.bad{border-left:3px solid var(--warn)}
.fa canvas{display:block;border-radius:10px}

/* 实验日程 */
.scr.levels{display:flex;flex-direction:column;gap:30px;padding:54px 64px 34px}
.l-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.l-head h1{margin:0 0 12px;font:700 40px/1 var(--sans);color:#fff}
.l-head p{margin:0;max-width:46em;font:400 14.5px/1.7 var(--sans);color:var(--muted)}
.l-ci{display:grid;justify-items:end;gap:6px;flex:none}
.l-ci span{font:500 13px/1 var(--sans);color:var(--muted)}
.l-ci b{font:600 60px/1 var(--num);color:#fff}
.l-ci b.none{font:500 22px/1.4 var(--sans);color:var(--faint)}
.l-ci i{font:400 11.5px/1 var(--sans);color:var(--faint);font-style:normal}
.l-row{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.l-row::before{display:none;content:"";position:absolute;left:42px;right:42px;top:41px;height:2px;background:linear-gradient(90deg,rgba(139,132,255,.7),rgba(139,132,255,.12))}
.l-card{position:relative;display:flex;flex-direction:column;gap:8px;min-height:310px;padding:18px 18px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;box-sizing:border-box}
.l-card:hover{border-color:var(--line-hi)}
.l-card.sel{background:rgba(139,132,255,.1);border-color:rgba(139,132,255,.55);box-shadow:0 0 0 3px rgba(139,132,255,.12)}
.l-card.lock{opacity:.42;cursor:not-allowed}
.l-num{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#141a22;border:2px solid var(--nitrile);font:700 20px/1 var(--num);color:#fff}
.l-card.done .l-num{background:var(--nitrile)}
.l-day{margin:8px 0 0;font:500 12.5px/1 var(--sans);color:#c9c5ff}
.l-card h2{margin:0;font:600 19px/1.3 var(--sans);color:#fff}
.l-blurb{flex:1;margin:0;font:400 13px/1.7 var(--sans);color:var(--muted)}
.l-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:500 12.5px/1 var(--sans);color:var(--muted)}
.l-stars{display:flex;gap:1px}
.l-lock{color:var(--faint)}
.l-ach h2{margin:0 0 12px;font:600 15px/1 var(--sans)}
.l-ach ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.l-ach li{display:grid;gap:4px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line-hi);opacity:.5}
.l-ach li.on{opacity:1;border-style:solid;border-color:rgba(243,193,74,.5);background:rgba(243,193,74,.07)}
.l-ach b{font:600 13px/1.3 var(--sans)}
.l-ach span{font:400 11.5px/1.5 var(--sans);color:var(--muted)}
.l-keys{display:flex;gap:22px;margin-top:auto;font:400 12.5px/1 var(--sans);color:var(--muted)}
.l-keys span{display:flex;gap:6px;align-items:center}

/* 简报 */
.scr.brief{display:grid;grid-template-columns:1fr 540px;gap:56px;padding:64px 72px}
.b-aim{margin:0 0 8px;max-width:36em;font:400 16px/1.85 var(--sans);color:#cfd5de}
.b-facts{margin:0;padding:0 0 0 18px;display:grid;gap:8px;max-width:42em;font:400 14px/1.6 var(--sans);color:var(--muted)}
.b-side{display:flex;flex-direction:column;min-height:0;padding:20px 22px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.b-side h2{margin-top:0}
.b-steps{flex:1;margin:0;padding:0 0 0 24px;overflow:auto;display:grid;align-content:start;gap:7px;font:400 13px/1.55 var(--sans);color:#cfd5de}
.b-steps li::marker{color:var(--faint);font:600 12px var(--num)}
.b-steps li.opt{color:var(--muted)}
.b-steps li.opt::after{content:"（可选）";color:var(--faint)}
.b-par{margin:14px 0 0;font:400 12.5px/1.9 var(--sans);color:var(--faint)}
.b-par kbd{margin:0 2px}

/* 结算 */
.scr.results{display:grid;grid-template-columns:520px 1fr;gap:52px;padding:54px 64px}
.r-left{display:flex;flex-direction:column}
.r-stars{display:flex;gap:6px;margin:0 0 14px}
.r-total{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.r-total b{font:600 64px/1 var(--num);color:#fff}
.r-total span{font:500 14px/1 var(--sans);color:var(--muted)}
.r-bar{display:grid;grid-template-columns:84px 1fr 40px;gap:4px 12px;align-items:center;margin:9px 0}
.r-bar span{font:500 13px/1 var(--sans)}
.r-bar i{height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.r-bar i b{display:block;height:100%;border-radius:4px;background:var(--nitrile)}
.r-bar em{font:600 14px/1 var(--num);font-style:normal;text-align:right}
.r-bar small{grid-column:2/4;margin-top:-1px;font:400 11.5px/1.3 var(--sans);color:var(--faint)}
.r-ach{display:grid;gap:8px;margin-top:16px}
.r-ach span{display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:rgba(243,193,74,.08);border:1px solid rgba(243,193,74,.35);font:400 12.5px/1.5 var(--sans);color:var(--muted)}
.r-ach b{font:600 13px/1.4 var(--sans);color:#f6d68a}
.r-right{min-height:0;overflow:auto;padding-right:10px}
.r-right h2:first-child{margin-top:4px}
.r-t{width:100%;border-collapse:collapse;font:400 13.5px/1.4 var(--sans)}
.r-t td{padding:9px 8px;border-bottom:1px solid var(--line);color:#cfd5de;vertical-align:middle}
.r-t td.num{text-align:right;white-space:nowrap;font-family:var(--num);font-variant-numeric:tabular-nums}
.r-t td:last-child{width:130px}
.mini{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.mini b{display:block;height:100%}
.r-t .ok{color:#7fe6b5}.r-t .bad{color:#ffa3a3}.r-t .miss{color:var(--warn)}
.r-v{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.r-v li{display:grid;gap:4px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border-left:3px solid var(--warn)}
.r-v li.major{border-left-color:var(--err)}
.r-v b{font:600 13px/1.4 var(--sans)}
.r-v span{font:400 12px/1.65 var(--sans);color:var(--muted)}
.r-clean{margin:0;font:500 14px/1.5 var(--sans);color:#7fe6b5}

/* 失败 */
.scr.fail{display:grid;place-items:center;padding:48px}
.f-box{max-width:820px;max-height:800px;overflow:auto}
.fail h1{color:#ffc2c2}
.f-sub{margin:0 0 20px;font:400 15px/1.75 var(--sans);color:var(--muted)}

/* 患者结局 */
.scr.outcome{display:grid;grid-template-columns:600px 1fr;gap:48px;padding:40px 56px;background:#07090c}
.oc-ct{display:flex;flex-direction:column;gap:12px}
.oc-ct #ct{border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.oc-time{padding:8px 0 10px;border-radius:10px;background:#0d1218;border:1px solid var(--line)}
.oc-scrub{display:flex;gap:18px;padding:4px 14px 0;font:400 12px/1 var(--sans);color:var(--faint)}
.oc-scrub span{display:flex;align-items:center;gap:6px}
.oc-side{display:flex;flex-direction:column;min-height:0;overflow:auto;padding-right:8px}
.oc-kicker{margin:0 0 8px;font:500 14px/1.3 var(--sans);color:#c9c5ff}
.oc-side h1{margin:0 0 8px;font:700 32px/1.25 var(--sans);color:#fff}
.oc-rx{margin:0 0 20px;font:400 14.5px/1.65 var(--sans);color:var(--muted)}
.oc-index{display:flex;align-items:baseline;gap:12px;margin-bottom:22px}
.oc-index span{font:500 15px/1 var(--sans);color:var(--muted)}
.oc-index b{font:600 104px/.85 var(--num);color:#fff}
.oc-index i{font:500 18px/1 var(--num);font-style:normal;color:var(--faint)}
.oc-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 24px}
.oc-facts div{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.oc-facts dt{margin-bottom:8px;font:500 12px/1.4 var(--sans);color:var(--muted)}
.oc-facts dd{margin:0;display:grid;gap:4px}
.oc-facts dd b{font:600 20px/1.2 var(--sans);color:#fff}
.oc-facts dd b.bad{color:#ffa3a3}
.oc-facts dd span{font:400 12px/1.5 var(--sans);color:var(--faint)}
.oc-reveal h2{margin:0 0 10px;font:600 15px/1 var(--sans)}
.oc-reveal article{margin-bottom:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
.oc-reveal article.chosen{border-color:rgba(139,132,255,.5);background:rgba(139,132,255,.07)}
.oc-reveal header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.oc-reveal header b{flex:none;white-space:nowrap;font:700 15px/1 var(--sans)}
.oc-reveal header span{font:500 13px/1.3 var(--sans);color:#c9c5ff}
.oc-reveal header em{margin-left:auto;font:500 11.5px/1 var(--sans);font-style:normal;color:var(--nitrile)}
.oc-reveal p{margin:0;font:400 13px/1.7 var(--sans);color:var(--muted)}
.oc-note{margin:6px 0 16px;font:400 11.5px/1.6 var(--sans);color:var(--faint)}
.oc-side > .btn{align-self:flex-start}

/* 分析软件 */
#analysis .body{padding:14px 18px 18px}
.an-top{display:flex;align-items:center;gap:20px;margin-bottom:14px}
.an-top .btn{margin-left:auto}
.an-pl{display:flex;align-items:center;gap:8px;font:400 13px/1 var(--sans);color:var(--muted)}
.an-pl i{width:8px;height:8px;border-radius:50%}
.an-pl b{font-weight:500;color:var(--fg)}
.an-grid{display:grid;grid-template-columns:700px 1fr;gap:22px;align-items:start}
.an-grid canvas{display:block;border-radius:10px}
.an-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font:400 12px/1 var(--sans);color:var(--muted)}
.an-legend span{display:flex;align-items:center;gap:7px}
.an-legend i{width:18px;height:3px;border-radius:2px}
.an-legend i.dash,.an-t .sw.dash{height:0;border-top:2px dashed;background:none}
.an-side{display:grid;gap:14px}
.an-empty{margin:0;padding:16px;border-radius:10px;border:1px dashed var(--line-hi);font:400 13.5px/1.7 var(--sans);color:var(--muted)}
.an-t{width:100%;border-collapse:collapse;font:400 12.5px/1.3 var(--sans)}
.an-t th{padding:4px 6px;border-bottom:1px solid var(--line-hi);font-weight:500;color:var(--faint);text-align:left}
.an-t th:nth-child(n+3){text-align:right}
.an-t td{padding:6px;border-bottom:1px solid var(--line);color:#d5dae2}
.an-t td.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.an-t .sw{display:inline-block;width:14px;height:3px;margin-right:7px;border-radius:2px;vertical-align:middle}
.an-dec{display:grid;gap:10px;padding:14px;border-radius:12px;background:rgba(139,132,255,.06);border:1px solid rgba(139,132,255,.25)}
.an-dec h3{margin:0;font:600 14px/1.2 var(--sans)}
.an-dec p{margin:0;font:400 12.5px/1.6 var(--sans);color:var(--muted)}
.an-ch{display:flex;gap:8px}
.btn.on{background:rgba(139,132,255,.22);border-color:var(--nitrile);color:#fff}
.an-pred{display:grid;gap:4px;font:400 13px/1.5 var(--sans);color:var(--muted)}
.an-pred b{font-weight:600;color:#fff}
.an-dec .btn.primary{justify-self:start}
#step .co{font:500 13px/1.55 var(--sans);color:#ecebff;}
#step .co em{font:700 11px/1 var(--sans);font-style:normal;color:#c9c5ff;padding:3px 6px;margin-right:7px;border-radius:5px;background:rgba(139,132,255,.2);vertical-align:1px;}
#step .co i{font-style:normal;display:inline-flex;gap:4px;vertical-align:middle;margin:-2px 0 0 4px;}
#step .co kbd{height:19px;min-width:19px;font-size:11px;}
#coachRing{position:absolute;left:0;top:0;border-radius:12px;border:2px solid var(--nitrile);box-shadow:0 0 0 4px rgba(139,132,255,.18);pointer-events:none!important;transition:transform .25s ease,width .25s ease,height .25s ease;animation:coachPulse 1.4s ease-in-out infinite;}
@keyframes coachPulse{50%{box-shadow:0 0 0 9px rgba(139,132,255,0);border-color:#b7b2ff}}
#narrow{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:var(--ink);font:500 16px/1.6 var(--sans);color:var(--muted);}
@media (max-width:860px),(max-height:440px){#narrow{display:grid}#game{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* 显微镜 */
.scope{display:grid;grid-template-columns:700px 1fr;gap:22px}
.scope .eye{position:relative;width:700px;height:620px;border-radius:14px;overflow:hidden;background:#030405;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.scope .eye canvas{position:absolute;left:0;top:0}
.scope .ov{cursor:crosshair}
.scope .cap{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:7px 14px;border-radius:9px;background:rgba(14,26,20,.88);color:#7fe6b5;font:600 13px var(--sans)}
.scope .cap.bad{color:var(--warn)}
.scope .ctl{display:grid;gap:16px;align-content:start}
.scope .lbl{display:flex;align-items:center;gap:4px;margin-bottom:7px;font:500 12px/1 var(--sans);color:var(--muted)}
.scope .lbl kbd{min-width:18px;height:18px;font-size:10.5px;padding:0 4px}
.seg{display:flex;gap:4px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg);font:500 13px var(--sans);cursor:pointer}
.seg button.on{background:rgba(139,132,255,.18);border-color:rgba(139,132,255,.5);color:#fff}
.seg.obj i{width:9px;height:9px;border-radius:50%}
.knob{display:flex;align-items:center;gap:16px}
.knob svg{width:84px;height:84px}
.knob .kr{fill:#1b2129;stroke:#3a4452;stroke-width:2}
.knob .kt line{stroke:#9aa6b4;stroke-width:2}
.knob .kc{fill:#252c36}
.knob .fz{font:600 18px var(--num);color:#fff}
.scope .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.scope .bar b{display:block;height:100%;background:linear-gradient(90deg,#5d55e6,#8b84ff)}
.scope .map{display:block;border-radius:8px}
.scope .where{margin-top:6px;font:500 12.5px var(--sans);color:var(--muted)}
.scope .tally{display:grid;gap:4px}
.scope .tally .row{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.03);font:400 13px var(--sans);cursor:pointer}
.scope .tally .row.on{background:rgba(139,132,255,.14)}
.scope .tally .sum{background:none;color:#fff;cursor:default}
.scope .tally p{margin:4px 0 0;font:400 12px/1.6 var(--sans);color:var(--muted)}

/* LabAssist (automation workstation) */
.al .body{padding:0 !important}
.al-tabs{display:flex;gap:2px;padding:8px 12px 0;background:#1d2229;border-bottom:1px solid var(--os-line)}
.al-tabs button{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:0;border-radius:6px 6px 0 0;background:transparent;color:#9aa6b3;font:500 13px var(--sans);cursor:pointer}
.al-tabs button[aria-pressed=true]{background:var(--os-bg);color:#fff;box-shadow:inset 0 2px 0 #7c5cf0}
.al-body{padding:16px 18px 18px;max-height:640px;overflow:auto}
.al h3{margin:0 0 10px;font:600 14.5px/1.3 var(--sans);color:#e8eef5;display:flex;align-items:center;gap:10px}
.al .tag{font:500 11px/1 var(--sans);padding:3px 8px;border-radius:10px;background:#3a3150;color:#cfc3ff}.al .tag.ok{background:#1d4a37;color:#7fe8b8}
.al-chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.al-chat .ai,.al-chat .me{max-width:78%;padding:11px 14px;border-radius:14px;font:400 13.5px/1.65 var(--sans)}
.al-chat .ai{background:#232a35;color:#dfe6ee;border-top-left-radius:4px}.al-chat .ai.small{font-size:12px;color:#9aa6b3;background:#1b2028}
.al-chat .me{align-self:flex-end;background:#2f6fd6;color:#fff;border-top-right-radius:4px}
.al-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.al-row label{font:500 13px var(--sans);color:#9aa6b3}
.al-in{width:120px;height:30px;border-radius:4px;border:1px solid #46505c;background:#11161c;color:#fff;font:500 14px var(--num);padding:0 8px}
.al .btn.on{background:#2f6fe0;border-color:#4a86f0;color:#fff}
.al-split{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.al-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.al-steps li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid #2c3540;border-radius:6px;background:#161b22;counter-increment:s}
.al-steps li::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:4px;background:#232c38;color:#9fb0c2;font:600 11px/20px var(--num);text-align:center}
.al-steps li>div{flex:1;display:flex;flex-direction:column;gap:3px}
.al-steps b{font:500 13px/1.5 var(--sans);color:#dce4ec}.al-steps span{font:400 11.5px var(--num);color:#6f7d8c}
.al-steps .flaw{font:500 12.5px/1.5 var(--sans);font-style:normal;color:#ffc87a}
.al-plate{display:grid;grid-template-columns:18px repeat(12,22px);gap:3px;align-items:center;margin-bottom:10px}
.al-plate .h{font:500 10.5px var(--num);color:#7f8c9b;text-align:center}
.al-plate i,.al-legend i{width:18px;height:18px;border-radius:50%;justify-self:center;display:inline-block}
.al i.pbs{background:#3b4a5a}.al i.veh{background:#d9dfe6}.al i.d0{background:#8b84ff}.al i.d1{background:#ff8a6a}.al i.blk{background:#1b222b;box-shadow:inset 0 0 0 1px #3b4a5a}
.al-legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;font:400 12px var(--sans);color:#aab4bf}
.al-legend li{display:flex;align-items:center;gap:7px}.al-legend i{width:12px;height:12px}
.al-tasks{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.al-tasks li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid #2c3540;border-radius:6px;background:#161b22;font:400 13px/1.45 var(--sans);color:#dce4ec}
.al-tasks li.ok{border-color:#1f5a42;background:#12211b}.al-tasks li b{font:500 12px var(--sans);color:#6fe0ae;white-space:nowrap}
.al-phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.al-phases li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:6px;font:400 13px var(--sans);color:#8e9aa7}
.al-phases li i{width:10px;height:10px;border-radius:50%;background:#3a4552}
.al-phases li.done{color:#9fd9bf}.al-phases li.done i{background:#3fd18f}
.al-phases li.now{background:#16202c;color:#fff}.al-phases li.now i{background:#4c8dff;box-shadow:0 0 0 4px rgba(76,141,255,.25)}
.al-phases li.fault{background:#2b2214;color:#ffd38a}.al-phases li.fault i{background:#f3b64a}
.al-phases span{font:400 12px var(--num)}
.al-fault{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding:12px 14px;border-radius:8px;border:1px solid #6b5422;background:#241c10;color:#f0dcb0;font:400 13px/1.55 var(--sans)}
.al-fault b{color:#ffd38a}.al-fault .btn{align-self:flex-start}
.al .an-t td.bad{color:#ff9d9d}
#alchart{width:560px;height:320px;border-radius:6px;margin-bottom:10px}

/* CT console and molecular instruments */
.ctc{background:linear-gradient(#0f151d,#0a0f15)!important}
.ctc .body{padding:14px 16px}
.ctgrid{display:grid;grid-template-columns:168px 660px 220px 1fr;gap:14px;align-items:start}
.rail{display:flex;flex-direction:column;gap:6px}
.rail button{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--muted);font:500 13.5px/1 var(--sans);cursor:pointer;text-align:left}
.rail button i{font:600 11px/1 var(--num);font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #3a4756}
.rail button em{margin-left:auto;width:7px;height:7px;border-radius:50%;background:transparent}
.rail button.ok em{background:#46d39a}
.rail button[aria-current=true]{border-color:#6fc3ff;color:#fff;background:rgba(111,195,255,.1)}
.rail .dose{margin-top:12px;padding:10px;border-radius:9px;border:1px solid var(--line);font:400 12px/1.6 var(--sans);color:var(--muted)}
.rail .dose b{color:#e6edf4;font-family:var(--num)}
.view{position:relative;width:660px;height:660px;background:#000;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px #1d2733}
.view canvas{position:absolute;inset:0;width:660px;height:660px}
.view #ct2d{cursor:crosshair}
.refcol{display:flex;flex-direction:column;gap:8px}
.refcol .rc-h{margin:0;font:600 11.5px/1 var(--sans);letter-spacing:.06em;color:#7f8c9b}
.corwrap{position:relative;width:220px;height:220px;background:#000;border:1px solid #1f2b38;border-radius:4px;overflow:hidden}
.corwrap .cor{position:absolute;inset:0}.corwrap .cor canvas{position:absolute;inset:0;width:220px;height:220px}
.corwrap .ovl{position:absolute;inset:0;pointer-events:none}
.corwrap .ovl .cline{position:absolute;left:0;right:0;height:1px;background:#ffd34d;opacity:.85}
.series{display:flex;flex-direction:column;gap:6px}
.series .se{display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto;column-gap:8px;padding:8px 9px;border-radius:6px;border:1px solid #1f2b38;background:#070b10}
.series .se i{grid-row:span 2;font:600 11px/22px var(--num);font-style:normal;text-align:center;border-radius:4px;background:#121c27;color:#8fa1b3;height:22px}
.series .se b{font:500 12.5px/1.35 var(--sans);color:#d4dde6}.series .se span{font:400 11.5px/1.4 var(--num);color:#6f7d8c}
.series .se.on{border-color:#3d7fc7;background:#0b1622}.series .se.on i{background:#2f6fd6;color:#fff}
.side h3{margin:0 0 8px;font:600 15px/1.3 var(--sans);color:#e8eef5}
.side .hint{font:400 12.5px/1.65 var(--sans);color:var(--muted);margin:6px 0 12px}
.side .hint b{color:#dce4ec}
.side .hint.warn{color:#ffc87a}.side .hint.good{color:#6fe0ae}
.side .kv{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font:400 13px/1.3 var(--sans);color:var(--muted)}
.side .kv b{font:600 14px/1 var(--num);color:#e8eef5;font-variant-numeric:tabular-nums}
.side .kv.good b{color:#6fe0ae}.side .kv.warn b{color:#ffc87a}
.side .keys{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0;font:400 12.5px/1.6 var(--sans);color:var(--muted)}
.side .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}
.side .row label{font:500 12.5px/1.3 var(--sans);color:var(--muted)}
.side .num{font:600 18px/1 var(--num);color:#fff}.side .num b{font-weight:600}
.side .seg{display:inline-flex;border:1px solid var(--line-hi);border-radius:8px;overflow:hidden}
.side .seg button{height:30px;padding:0 11px;border:0;background:transparent;color:var(--muted);font:500 12.5px/1 var(--sans);cursor:pointer;border-right:1px solid var(--line)}
.side .seg button:last-child{border-right:0}
.side .seg button[aria-pressed=true]{background:rgba(111,195,255,.18);color:#fff}
.side .card{border:1px solid var(--line);border-radius:10px;padding:12px;background:rgba(255,255,255,.03);margin-bottom:10px}
.side .pt b{display:block;font:600 15px/1.4 var(--sans);color:#fff}.side .pt span{font:400 12.5px/1.5 var(--sans);color:var(--muted)}
.side .order{margin-top:8px;font:400 12.5px/1.5 var(--sans);color:var(--muted)}.side .order b{color:#cfe6ff}
.side .chk{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:9px 10px;margin:5px 0;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:#cdd6df;font:400 13px/1.5 var(--sans);cursor:pointer}
.side .chk[aria-pressed=true]{border-color:rgba(70,211,154,.6);background:rgba(70,211,154,.08)}
.side .chk[aria-pressed=true] span::before{content:"✓ ";color:#46d39a;font-weight:700}
.side .bigkey{margin:18px 0;font:500 14px/1 var(--sans);color:#ffd27a;display:flex;align-items:center;gap:10px}
.side .seq{margin:6px 0 10px;padding-left:20px;font:400 13px/1.9 var(--sans);color:#cdd6df}
.side .seq li.ok{color:#6fe0ae}
.side .status{padding:10px 12px;border-radius:9px;background:rgba(0,0,0,.3);border:1px solid var(--line);font:500 13px/1.5 var(--sans);color:#cdd6df;margin:8px 0}
.side .status .hot{color:#ffb347}
.side .btn{margin-top:12px}
.side .field{margin:8px 0}
.gp .body{padding:14px 18px}
.gp canvas{display:block;border-radius:8px;background:#05080b}
.gp .two{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.gp .seqline{font:500 15px/1.9 var(--num);letter-spacing:.06em;word-break:break-all;color:#cdd6df;background:rgba(0,0,0,.3);padding:10px 12px;border-radius:8px}
.gp .seqline .pam{background:rgba(255,179,71,.3);color:#ffd9a0}.gp .seqline .sp{background:rgba(111,195,255,.22);color:#fff}.gp .seqline .tg{outline:1.5px solid #ff6b6b;color:#ffb0b0}
.gp table{border-collapse:collapse;width:100%;font:400 13px/1.4 var(--sans)}
.gp td,.gp th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.gp th{color:var(--muted);font-weight:500}.gp td{font-family:var(--num);font-variant-numeric:tabular-nums}
.gp tr[aria-selected=true] td{background:rgba(111,195,255,.12);color:#fff}
.gp tr{cursor:pointer}
.gp .pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.gp .pick .pl{color:var(--muted);font:500 12.5px var(--sans);margin-right:4px}.gp .pick .pe{color:var(--faint);font:400 13px var(--sans)}
.gp .chip{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line-hi);background:rgba(255,255,255,.03);color:#cdd6df;font:400 12.5px var(--sans);cursor:pointer;transition:background .18s,border-color .18s}
.gp .chip b{font:600 12px var(--num);color:#7fd3ff;margin-right:2px}.gp .chip:hover{border-color:#6fc3ff}
.gp .chip[aria-pressed=true]{background:rgba(111,195,255,.18);border-color:#6fc3ff;color:#fff}
.gp .chk{border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:#cdd6df;font:400 13px/1.5 var(--sans);cursor:pointer;padding:9px 12px}
.gp .chk[aria-pressed=true]{border-color:#6fc3ff;background:rgba(111,195,255,.14);color:#fff}
.gp .job{margin:12px 0;padding:10px 12px;border-radius:10px;border:1px solid rgba(111,195,255,.35);background:rgba(111,195,255,.06)}
.gp .job .jl{display:flex;justify-content:space-between;font:500 13px var(--sans);margin-bottom:6px}.gp .job .jl span{color:var(--muted);font-family:var(--num)}
.gp .job i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-bottom:8px;position:relative;overflow:hidden}
.gp .job i::after{content:"";position:absolute;inset:0;width:calc(var(--q)*100%);background:linear-gradient(90deg,#3d9be0,#7fd3ff);border-radius:3px;transition:width .25s}

/* 工作站软件外观：PC 应用窗口 + 仪器触摸屏 */
.panel.os{--os-bg:#1b1f24;--os-chrome:#262b32;--os-line:#363d47;--os-text:#d9e0e8;--os-mute:#94a0ad;--os-acc:#3b82f6;
  border-radius:8px;background:var(--os-bg);border:1px solid #3d4550;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 28px 70px -18px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.4);font-family:"Segoe UI",var(--sans)}
.panel.os .body{background:var(--os-bg)}
.os-title{height:34px;display:flex;align-items:center;gap:9px;padding:0 0 0 10px;background:linear-gradient(#2e343c,#272c33);border-bottom:1px solid #1a1e23;user-select:none;flex:none}
.os-ico{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:#fff;font:700 9.5px/1 var(--num);letter-spacing:-.02em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}.os-ico svg{width:12px;height:12px}
.os-app{font:600 12.5px/1 var(--sans);color:var(--os-text);white-space:nowrap}.os-app em{font-style:normal;font-weight:400;color:var(--os-mute)}
.os-doc{flex:1;min-width:0;font:400 12.5px/1 var(--sans);color:var(--os-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.os-doc::before{content:"— ";color:#5d6773}
.os-wb{display:flex;align-self:stretch}
.os-wb i,.os-wb .cls{width:46px;display:grid;place-items:center;position:relative}
.os-wb i.min::after{content:"";width:10px;height:1px;background:#b9c2cc}
.os-wb i.max::after{content:"";width:9px;height:9px;border:1px solid #b9c2cc}
.os-wb .cls{width:58px;border:0;background:transparent;color:#d6dde5;cursor:pointer;font:400 12px/1 var(--sans)}
.os-wb .cls::before{content:"";position:absolute;width:12px;height:12px;background:linear-gradient(45deg,transparent 46%,#d6dde5 46%,#d6dde5 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#d6dde5 46%,#d6dde5 54%,transparent 54%);left:9px;top:50%;transform:translateY(-50%)}
.os-wb .cls kbd{margin-left:16px;font:600 9.5px/1 var(--num);padding:2px 4px;border-radius:3px;background:rgba(255,255,255,.1);color:#aab4bf}
.os-wb .cls:hover{background:#c42b1c}
.os-menu{height:25px;display:flex;align-items:stretch;background:#22272d;border-bottom:1px solid var(--os-line);padding:0 4px;flex:none;user-select:none}
.os-menu span{display:flex;align-items:center;padding:0 10px;font:400 12.5px/1 var(--sans);color:#c6cfd8;cursor:default}
.os-menu span:hover,.os-menu span.open{background:#333a44}
.os-drop{position:absolute;z-index:30;min-width:210px;padding:4px;background:#2b3139;border:1px solid #444d58;border-radius:7px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.os-drop button{display:flex;justify-content:space-between;align-items:center;gap:24px;width:100%;height:28px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:#dfe6ee;font:400 12.5px/1 var(--sans);cursor:pointer;text-align:left}
.os-drop button:hover:not(:disabled){background:#3a7bd5;color:#fff}
.os-drop button:disabled{color:#6f7a86;cursor:default}
.os-drop kbd{font:400 11px/1 var(--num);color:inherit;opacity:.7;background:none;border:0;padding:0}
.os-drop hr{border:0;border-top:1px solid #444d58;margin:4px 6px}
.os-menu .os-user{margin-left:auto;color:var(--os-mute);font-size:11.5px}
.os-menu .os-user::before{content:"";width:14px;height:14px;border-radius:50%;background:#4a5563;margin-right:6px;box-shadow:inset 0 -5px 0 #6b7787}
.os-info{display:flex;gap:9px;align-items:flex-start;padding:7px 12px;background:#1f252c;border-bottom:1px solid var(--os-line);font:400 12px/1.5 var(--sans);color:var(--os-mute);flex:none}
.os-info i{flex:none;width:15px;height:15px;border-radius:50%;background:#2a5ea8;color:#fff;font:700 10px/15px Georgia,serif;text-align:center;font-style:italic;margin-top:1px}
.os-status{height:23px;display:flex;align-items:center;gap:10px;padding:0 10px;background:#2a3038;border-top:1px solid var(--os-line);font:400 11.5px/1 var(--sans);color:#a7b2be;flex:none;white-space:nowrap}
.os-status [data-osst]{flex:1;overflow:hidden;text-overflow:ellipsis}
.os-sep{width:1px;height:12px;background:#47505b}
.os-task{height:40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;background:rgba(20,25,33,.97);border-top:1px solid #2f3843;flex:none;user-select:none;backdrop-filter:blur(20px)}
.os-tl{display:flex;align-items:center}
.os-wx{display:flex;flex-direction:column;font:500 11px/1.25 var(--sans);color:#dfe6ee;padding-left:6px;border-left:3px solid #f2b84b}.os-wx small{font-size:10px;color:#9aa6b3}
.os-center{display:flex;align-items:center;gap:3px}
.os-start{width:34px;height:32px;display:grid;grid-template-columns:repeat(2,8px);gap:1.5px;place-content:center;border-radius:5px}
.os-start i{width:8px;height:8px;background:linear-gradient(135deg,#5aa2ff,#2f6fe0);border-radius:1.5px}
.os-start:hover,.os-pin:hover{background:rgba(255,255,255,.07)}
.os-search{height:28px;width:170px;border-radius:14px;background:#262f3b;border:1px solid #333d4a;color:#8794a1;font:400 12px/26px var(--sans);padding-left:30px;position:relative;margin:0 6px 0 4px;box-sizing:border-box}
.os-search::before{content:"";position:absolute;left:11px;top:7px;width:8px;height:8px;border:1.6px solid #9aa6b3;border-radius:50%}
.os-search::after{content:"";position:absolute;left:20px;top:17px;width:4px;height:1.6px;background:#9aa6b3;transform:rotate(45deg)}
.os-pin{width:36px;height:34px;display:grid;place-items:center;border-radius:5px;position:relative}
.os-pin b{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.os-pin.on{background:rgba(255,255,255,.09)}
.os-pin.on::after{content:"";position:absolute;bottom:1px;width:16px;height:3px;border-radius:2px;background:#6aa8ff}
.os-tray{justify-self:end;display:flex;align-items:center;gap:8px;color:#d4dbe3;font:400 11px/1.2 var(--num)}
.os-chev{font:400 11px/1 var(--sans);color:#aeb8c3;padding:0 2px}
.os-ic3{display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:5px}
.os-ic3:hover{background:rgba(255,255,255,.07)}
.os-tray i{width:14px;height:12px;opacity:.9;display:block}
.os-tray .ic-net{background:linear-gradient(to top,#d4dbe3 0 3px,transparent 3px) 0 100%/3px 100% no-repeat,linear-gradient(to top,#d4dbe3 0 7px,transparent 7px) 5px 100%/3px 100% no-repeat,linear-gradient(to top,#d4dbe3 0 12px,transparent 12px) 10px 100%/3px 100% no-repeat}
.os-tray .ic-vol{clip-path:polygon(0 35%,30% 35%,65% 0,65% 100%,30% 65%,0 65%);background:#d4dbe3}
.os-bell{width:12px;height:13px;margin:0 4px 0 2px;background:#cfd7df;clip-path:polygon(50% 0,70% 12%,78% 40%,92% 72%,100% 80%,0 80%,8% 72%,22% 40%,30% 12%,40% 0,40% 86%,60% 86%,60% 100%,40% 100%,40% 86%,0 80%);opacity:.8}
.os-ime{font:500 11px/1 var(--sans)}
.os-time{display:flex;flex-direction:column;align-items:flex-end;padding:0 4px;text-align:right}.os-time b{font-weight:500}.os-time small{font-size:10.5px;color:#aeb8c3}
/* 设备触摸屏：塑料边框 + 状态栏 */
.panel.os-dev{border-radius:26px;padding:14px;background:linear-gradient(#3a4049,#24282e);border:1px solid #4a525d;box-shadow:0 28px 70px -18px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.12)}
.panel.os-dev > *{background:#121820}
.os-devbar{height:34px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;background:linear-gradient(#1e6b57,#175646) !important;border-radius:12px 12px 0 0;flex:none;color:#eafff7;user-select:none}
.os-devname{font:700 13px/1 var(--num);letter-spacing:.02em}
.os-devdoc{flex:1;min-width:0;font:400 12.5px/1 var(--sans);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.os-devicons{display:flex;align-items:center;gap:8px;font:500 12px/1 var(--num)}
.os-devicons i{width:12px;height:9px;border:1.5px solid #cdeee3;border-radius:2px;opacity:.75}
.os-devhome{height:24px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font:500 12px/1 var(--sans);padding:0 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.os-devhome kbd{font:600 9.5px/1 var(--num);padding:2px 4px;border-radius:3px;background:rgba(0,0,0,.2)}
.os-dev .os-info{border-radius:0}
.os-dev > .body{border-radius:0 0 12px 12px}
/* 软件窗口里的控件：扁平、小圆角 */
.panel.os .btn{height:30px;border-radius:4px;background:#323944;border-color:#46505c;font-size:13px}
.panel.os .btn:hover{background:#3b4350}
.panel.os .btn.primary{background:#2f6fe0;border-color:#4a86f0}
.panel.os .btn.primary:hover{background:#3a7bec}
.panel.os .chip{border-radius:4px}
.panel.os canvas{border-radius:2px}
.panel.os .side .card,.panel.os .side .chk,.panel.os .side .status{border-radius:4px}
.panel.os .side .seg{border-radius:4px}
.sup-tabs{display:flex;gap:2px;margin:10px 0 8px;border-bottom:1px solid var(--line)}
.sup-tabs button{height:32px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:500 13px/1 var(--sans);cursor:pointer;display:flex;align-items:center;gap:6px}
.sup-tabs button[aria-selected=true]{color:#fff;border-bottom-color:#4a86f0}
.sup-tabs em{font-style:normal;font:500 11px/1 var(--num);color:var(--faint)}
</style>
</head>
<body>
<div id="app">
  <div id="game">
    <canvas id="gl" width="1600" height="900" aria-hidden="true"></canvas>
    <svg id="scene" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" aria-label="实验室场景"></svg>
    <div id="hud" hidden>
      <header id="topbar">
        <div class="brand"><b>湿实验室</b><span id="lvname"></span></div>
        <nav class="tabs" id="tabs" aria-label="工作站"></nav>
        <div class="spacer"></div>
        <div class="clock"><span class="t" id="clk">第 1 天 09:00</span><span class="s" id="clks"></span></div>
        <button class="tbtn" id="waitbtn" title="等待（Z）"><kbd>Z</kbd>等待</button>
        <button class="tbtn" id="nbbtn" title="实验记录本（N）"><kbd>N</kbd>记录本</button>
        <button class="tbtn" id="menubtn" title="暂停（P）"><kbd>P</kbd>暂停</button>
      </header>
      <div id="step" class="glass" role="button" tabindex="0" title="展开操作规程（L）"></div>
      <aside id="sop" class="glass" hidden></aside>
      <footer id="bottombar">
        <div id="held"></div>
        <div id="keys"></div>
      </footer>
      <div id="toasts"></div>
      <div id="coachRing" hidden></div>
      <div id="tip" class="glass" hidden></div>
      <div id="panelhost"></div>
      <section id="notebook" hidden></section>
    </div>
    <section id="screen"></section>
  </div>
  <div id="narrow">《湿实验室 WET LAB》是一个为电脑设计的实验室沙盒游戏，需要键盘和触控板（或鼠标）。请在更大的窗口中打开。</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
