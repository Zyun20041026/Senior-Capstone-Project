<!doctype html>
<!-- Alex 202384014054 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>衣壳锁定 · Capsid Lockdown</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="mode-select">
<div id="bg"></div>
<canvas id="back"></canvas>
<canvas id="gl"></canvas>
<canvas id="front"></canvas>
<div id="grain"></div>

<div id="hud">
  <!-- top band: title on the left, controls and readouts on the right -->
  <header id="top">
    <div id="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <div id="side">
      <nav id="controls">
        <button class="btn go" data-act="help" type="button">玩法 <kbd>?</kbd></button>
        <button class="btn play-only" data-act="hint" type="button">提示 <kbd>H</kbd></button>
        <button class="btn play-only" data-act="restart" type="button">重来 <kbd>R</kbd></button>
        <button class="btn play-only" data-act="dossier" type="button" id="btn-dossier">档案</button>
        <button class="btn duel-only" data-act="pause" type="button" id="btn-pause">暂停 <kbd>P</kbd></button>
        <button class="btn play-only duel-only" data-act="select" type="button">毒株 <kbd>ESC</kbd></button>
        <button class="btn play-only" data-act="focus" type="button" id="foc">聚焦 开 <kbd>V</kbd></button>
        <button class="btn" data-act="sound" type="button" id="snd">声音 开</button>
      </nav>

      <!-- strain list: the campaign -->
      <section id="campaign" class="strip select-only">
        <div class="stat lead">
          <b><span id="n-load">0</span><span class="of" id="load-unit"> log</span></b>
          <span>VIRAL LOAD<i>病毒载量 · 虚构</i></span>
          <div id="loadbar"><i></i></div>
        </div>
        <div class="stat"><b id="n-clear"></b><span>LOCKED<i>已锁定</i></span></div>
        <div class="stat"><b id="n-stars"></b><span>STARS<i>星级</i></span></div>
        <div class="stat"><b id="n-dossier"></b><span>DOSSIERS<i>档案</i></span></div>
        <button id="start" class="btn go" type="button"></button>
      </section>

      <!-- play: numbers -->
      <section id="stats" class="strip play-only">
        <div class="stat lead">
          <b><span id="n-lock">0</span><span class="of"> of <span id="n-safe">0</span></span></b>
          <span>LOCKED<i>已锁住的正常蛋白</i></span>
        </div>
        <div class="stat"><b><span id="n-left">0</span> of <span id="n-total">0</span></b><span>RESISTANT LEFT<i>未标记的耐药蛋白</i></span></div>
        <div class="stat"><b id="pips"></b><span>MISSES<i>失误</i></span></div>
        <div class="stat wide"><b id="iso"></b><span>STRAIN<i>毒株</i></span></div>
      </section>
      <div id="verdict" class="play-only"></div>
      <div id="after" class="play-only">
        <button id="next" class="btn go" type="button"></button>
        <button id="again" class="btn" type="button">再来一局 <kbd>R</kbd></button>
      </div>

      <!-- duel: numbers -->
      <section id="dstats" class="strip duel-only">
        <div class="stat lead" id="d-lossbox">
          <b><span id="d-loss">0</span><span class="of"> of <span id="d-max">8</span></span></b>
          <span>CELLS LOST<i>破裂的细胞 · 8 个就输</i></span>
          <div id="d-pips"></div>
        </div>
        <div class="stat"><b id="d-wave"></b><span>WAVE<i>波次</i></span></div>
        <div class="stat gold" id="d-ptsbox"><b id="d-pts">0</b><span>LIGHT<i>光点</i></span></div>
        <div class="stat wide"><b id="d-best"></b><span>BEST<i>最好成绩</i></span></div>
      </section>
    </div>
  </header>

  <!-- strain grid: labels are placed by script -->
  <section id="grid" class="select-only"></section>
  <nav id="pages" class="select-only" hidden></nav>

  <!-- what a click does -->
  <div id="tool" class="play-only" role="group" aria-label="点击动作">
    <button type="button" data-tool="dose" class="on"><b>下药</b><span>DOSE</span></button>
    <button type="button" data-tool="flag"><b>标记</b><span>FLAG · F</span></button>
  </div>

  <!-- duel: what the player has -->
  <div id="tray" class="duel-only" aria-live="polite">
    <div class="slot mac"><b>巨噬细胞</b><span>MACROPHAGE · 拖着走</span></div>
    <button type="button" class="slot" id="d-cloud" aria-pressed="false"><b>抗体云</b><span id="d-cloud-sub">第二波解锁</span></button>
  </div>

  <!-- duel: wave banner -->
  <div id="banner" class="duel-only" aria-live="polite"><b id="banner-title"></b><span id="banner-sub"></span></div>

  <!-- coach, hints and mistake explanations -->
  <aside id="panel" hidden aria-live="polite">
    <div id="panel-eyebrow"></div>
    <div id="panel-text"></div>
    <div id="panel-actions"></div>
  </aside>

  <footer id="legend" class="play-only duel-only">
    <div class="keys play-only" id="keys"></div>
    <div class="note play-only" id="note"></div>
    <div class="keys duel-only" id="dkeys"></div>
    <div class="note duel-only" id="dnote"></div>
  </footer>

  <div id="scale" class="play-only duel-only">
    <div class="cap" id="scale-cap"></div>
    <div class="lbl"><span id="scale-lbl"></span></div>
    <div class="bar" id="scale-bar"></div>
  </div>

  <!-- shown only while the clump is zoomed: tap to fit it again -->
  <button id="zoom" class="play-only duel-only" type="button" hidden aria-label="缩放复原"><b id="zoom-lbl">1.0×</b><span>复原</span></button>

  <div id="toast"></div>
</div>

<!-- dossier and help -->
<section id="card" hidden aria-labelledby="card-title">
  <div id="card-eyebrow"></div>
  <h2 id="card-title" tabindex="-1"></h2>
  <div id="card-sub"></div>
  <div id="card-body"></div>
  <div id="card-actions"></div>
</section>

<script src="js/core.js"></script>
<script src="js/boards.js"></script>
<script src="js/rules.js"></script>
<script src="js/viruses.js"></script>
<script src="js/levels.js"></script>
<script src="js/duel.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
